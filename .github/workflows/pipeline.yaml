name: CI/CD Pipeline - Sistema de Planillas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: BUILD Y TEST - auth-service (TypeScript)
  # ─────────────────────────────────────────────
  build-test-auth:
    name: Build & Test - auth-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P5/auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: P5/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 2: BUILD Y TEST - payroll-service (TypeScript)
  # ─────────────────────────────────────────────
  build-test-payroll:
    name: Build & Test - payroll-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P5/payroll-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: P5/payroll-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 3: BUILD Y TEST - api-gateway (TypeScript)
  # ─────────────────────────────────────────────
  build-test-gateway:
    name: Build & Test - api-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P5/api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: P5/api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 4: TEST - servicios Python
  # ─────────────────────────────────────────────
  build-test-python:
    name: Build & Test - Python services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies - approval-service
        run: |
          pip install -r P5/approval-service/requirements.txt

      - name: Install dependencies - notification-service
        run: |
          pip install -r P5/notification-service/requirements.txt

      - name: Syntax check - approval-service
        run: python -m py_compile P5/approval-service/main.py

      - name: Syntax check - notification-service
        run: python -m py_compile P5/notification-service/main.py

  # ─────────────────────────────────────────────
  # JOB 5: DOCKER BUILD & PUSH
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs:
      - build-test-auth
      - build-test-payroll
      - build-test-gateway
      - build-test-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./P5/api-gateway
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}

      - name: Build and Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/auth-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ github.sha }}

      - name: Build and Push payroll-service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/payroll-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/payroll-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/payroll-service:${{ github.sha }}

      - name: Build and Push approval-service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/approval-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/approval-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/approval-service:${{ github.sha }}

      - name: Build and Push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/notification-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 6: DEPLOY SIMULADO EN K8S
  # ─────────────────────────────────────────────
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.28.0

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply namespace
        run: kubectl apply -f P5/k8s/namespace.yaml

      - name: Apply configmap and secret
        run: |
          kubectl apply -f P5/k8s/configmap.yaml
          kubectl apply -f P5/k8s/secret.yaml

      - name: Update image tags in deployments
        run: |
          sed -i "s|image: auth-service:v1|image: ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ github.sha }}|g" P5/k8s/auth-service/deployment.yaml
          sed -i "s|image: payroll-service:v1|image: ${{ secrets.DOCKERHUB_USERNAME }}/payroll-service:${{ github.sha }}|g" P5/k8s/payroll-service/deployment.yaml
          sed -i "s|image: approval-service:v1|image: ${{ secrets.DOCKERHUB_USERNAME }}/approval-service:${{ github.sha }}|g" P5/k8s/approval-service/deployment.yaml
          sed -i "s|image: notification-service:v1|image: ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}|g" P5/k8s/notification-service/deployment.yaml
          sed -i "s|image: api-gateway:v1|image: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}|g" P5/k8s/api-gateway/deployment.yaml

      - name: Deploy services
        run: |
          kubectl apply -f P5/k8s/auth-service/
          kubectl apply -f P5/k8s/payroll-service/
          kubectl apply -f P5/k8s/approval-service/
          kubectl apply -f P5/k8s/notification-service/
          kubectl apply -f P5/k8s/api-gateway/

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/auth-service -n sa-p5 --timeout=120s
          kubectl rollout status deployment/payroll-service -n sa-p5 --timeout=120s
          kubectl rollout status deployment/approval-service -n sa-p5 --timeout=120s
          kubectl rollout status deployment/notification-service -n sa-p5 --timeout=120s
          kubectl rollout status deployment/api-gateway -n sa-p5 --timeout=120s

      - name: Verify all pods running
        run: kubectl get all -n sa-p5

      - name: Apply CronJob
        run: kubectl apply -f P5/k8s/cronjob/cronjob.yaml

      - name: Final status
        run: |
          echo "=========================================="
          echo "  DEPLOY COMPLETADO - Sistema de Planillas"
          echo "  Carne: 202204496"
          echo "  Commit: ${{ github.sha }}"
          echo "=========================================="
          kubectl get pods -n sa-p5
          kubectl get services -n sa-p5
          kubectl get hpa -n sa-p5