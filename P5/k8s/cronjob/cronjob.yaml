apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-log
  namespace: sa-p5
spec:
  schedule: "*/2 * * * *"       # cada 2 minutos
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cronjob-script
              image: cronjob-script:v1
              imagePullPolicy: Never
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: p5-secrets
                      key: DATABASE_URL
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"