apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - sa-p5
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service.sa-p5.svc.cluster.local:4000']
        metrics_path: '/metrics'

      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway.sa-p5.svc.cluster.local:3000']
        metrics_path: '/metrics'

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  alert.rules.yml: |
    groups:
      - name: microservices_alerts
        rules:
          - alert: PodDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod caido: {{ $labels.instance }}"
              description: "El pod {{ $labels.instance }} lleva mas de 1 minuto sin responder."

          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{namespace="sa-p5"}[5m]) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Alto uso de CPU en {{ $labels.pod }}"
              description: "El pod {{ $labels.pod }} supero el 80% de CPU por mas de 2 minutos."

          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{namespace="sa-p5"} / container_spec_memory_limit_bytes{namespace="sa-p5"} * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Alto uso de memoria en {{ $labels.pod }}"
              description: "El pod {{ $labels.pod }} supero el 80% de memoria por mas de 2 minutos."