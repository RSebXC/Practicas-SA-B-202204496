# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gold-prediction
  namespace: sa-p8
  labels:
    app: gold-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gold-prediction
  template:
    metadata:
      labels:
        app: gold-prediction
    spec:
      containers:
        - name: gold-prediction
          image: gold-prediction:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: MODEL_PATH
              value: "/app/model/gold_model.pkl"
            - name: FEATURES_PATH
              value: "/app/model/feature_names.pkl"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
# service.yaml
apiVersion: v1
kind: Service
metadata:
  name: gold-prediction
  namespace: sa-p8
spec:
  type: NodePort
  selector:
    app: gold-prediction
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
---
# hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gold-prediction-hpa
  namespace: sa-p8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gold-prediction
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80